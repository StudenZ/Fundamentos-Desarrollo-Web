<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Buscar</title>
  </head>
  <body style="background-color: lightgray;">
    <header style="background-color: darkblue; color: white; padding: 10px;">
      <h1 style="text-align: center;">Buscar</h1>
    </header>

    <nav style="background-color: lightblue; padding: 10px;">
      <ul style="list-style-type: none; text-align: center;">
        <li style="display: inline; margin-right: 10px;"><a href="../../index.html" style="color: black; text-decoration: none;">Inicio</a></li>
        <li style="display: inline; margin-right: 10px;"><a href="../sobreMi/sobreMi.html" style="color: black; text-decoration: none;">Sobre mí</a></li>
        <li style="display: inline; margin-right: 10px;"><a href="../objetivos/objetivos.html" style="color: black; text-decoration: none;">Objetivos</a></li>
        <li style="display: inline; margin-right: 10px;"><a href="../intereses/intereses.html" style="color: black; text-decoration: none;">Intereses</a></li>
        <li style="display: inline; margin-right: 10px;"><a href="../universidad/universidad.html" style="color: black; text-decoration: none;">Universidad</a></li>
        <li style="display: inline; margin-right: 10px;"><a href="../contacto/contacto.html" style="color: black; text-decoration: none;">Contacto</a></li>
        <li style="display: inline;"><a href="../buscar/buscar.html" style="color: black; text-decoration: none;">Buscar</a></li>
      </ul>
    </nav>

    <main style="background-color: white; margin: 20px; padding: 15px; border: 1px solid black;">
      <section id="formulario-busqueda" style="background-color: lightyellow; margin: 20px; padding: 15px; border: 1px dashed gray;">
        <h2 style="color: darkblue;">Formulario de búsqueda</h2>

        <form method="GET" action="buscar.html" style="color: black; text-decoration: none;">
          <div style="margin-bottom: 10px;">
            <label for="tema">Tema:</label><br>
            <input
              placeholder="Ingresa tu tema"
              type="text"
              id="tema"
              name="tema"
              style="padding: 5px; width: 200px;"
            />
          </div>

          <div style="margin-bottom: 10px;">
            <label for="clave">Contraseña:</label><br>
            <input
              placeholder="Ingresa tu contraseña"
              type="password"
              id="clave"
              name="clave"
              style="padding: 5px; width: 200px;"
            />
          </div>

          <div style="margin-bottom: 10px;">
            <label for="correo">Correo electrónico:</label><br>
            <input
              placeholder="Ingresa tu Correo"
              type="email"
              id="correo"
              name="correo"
              style="padding: 5px; width: 200px;"
            />
          </div>

          <div style="margin-bottom: 10px;">
            <label for="edad">Edad:</label><br>
            <input
              placeholder="tu edad"
              type="number"
              id="edad"
              name="edad"
              min="15"
              max="50"
              style="padding: 5px; width: 100px;"
            />
          </div>

          <div style="margin-bottom: 10px;">
            <label for="fecha">Fecha:</label><br>
            <input type="date" id="fecha" name="fecha" style="padding: 5px; width: 150px;" />
          </div>

          <div style="margin-bottom: 10px;">
            <p style="margin-bottom: 5px;">Intereses de búsqueda:</p>
            <label
              ><input type="checkbox" name="interes" value="html" /> HTML</label
            >
            <label
              ><input type="checkbox" name="interes" value="css" /> CSS</label
            >
            <label
              ><input type="checkbox" name="interes" value="javascript" />
              JavaScript</label
            >
          </div>

          <div style="margin-bottom: 10px;">
            <label for="color">Color favorito:</label>
            <input type="color" id="color" name="color" />
          </div>

          <div style="margin-bottom: 10px;">
            <label for="comentario">Comentarios:</label><br />
            <textarea
              id="comentario"
              name="comentario"
              rows="4"
              cols="40"
              style="padding: 5px;"
            ></textarea>
          </div>

          <div style="margin-top: 15px;">
            <button type="submit" style="padding: 5px 15px; background-color: darkblue; color: white;">Enviar</button>
            <button type="reset" style="padding: 5px 15px; background-color: gray; color: white;">Limpiar</button>
          </div>
        </form>
      </section>
    </main>

    <footer style="background-color: black; color: white; text-align: center; padding: 15px;">
      <p>Creado por Moises Valencia Ramirez</p>
      <p>Clase de fundamentos web - HTML Semantico</p>
      <p>ING. Sistemas</p>
    </footer>
  </body>
</html>
