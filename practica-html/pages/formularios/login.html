    <main style="background-color: white; margin: 20px; padding: 15px; border: 1px solid black; text-align: center;">
        <h2 style="color: darkblue;">Iniciar Sesión</h2>
        <form action="resultados.html" method="POST" style="margin: 20px; text-align: left; display: inline-block;">
            <label for="correo" style="font-size: 18px; color: black; display: block; margin-bottom: 5px;">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required style="padding: 5px; width: 250px; margin-bottom: 15px;">
            
            <label for="password" style="font-size: 18px; color: black; display: block; margin-bottom: 5px;">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required minlength="8" maxlength="16" pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,16}" title="Debe incluir letras, números y al menos un carácter especial." style="padding: 5px; width: 250px; margin-bottom: 15px;">
            
            <br>
            <button type="submit" style="padding: 10px 20px; background-color: darkblue; color: white; border: none; cursor: pointer; width: 100%;">Ingresar</button>
        </form>
    </main>

    <footer style="background-color: black; color: white; text-align: center; padding: 15px;">
